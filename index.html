<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="パシャ領収書">
<link rel="manifest" href="manifest.json">
<title>パシャ領収書</title>
<style>
  :root{
    --bg:#f6f7f5; --card:#fff; --ink:#1c1f1e; --sub:#5e6663; --line:#dfe3e1;
    --main:#0f766e; --main-ink:#fff; --rec:#c2410c; --ok:#15803d; --warn:#b45309;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#121514; --card:#1c201f; --ink:#eef1f0; --sub:#a3aca9; --line:#2f3533;
      --main:#14b8a6; --main-ink:#06201d; --rec:#fb923c; --ok:#4ade80; --warn:#fbbf24; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
  main{max-width:480px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  h1{font-size:20px;margin:0}
  .link{background:none;border:0;color:var(--sub);font-size:14px;text-decoration:underline;padding:8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
  .step{font-size:13px;color:var(--sub);margin:0 0 8px}
  .big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
    min-height:72px;border:0;border-radius:14px;font-size:20px;font-weight:700;
    background:var(--main);color:var(--main-ink);cursor:pointer}
  .big:disabled{opacity:.4}
  .big.rec{background:var(--rec);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.75}}
  .ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
  #preview{display:none;width:100%;max-height:260px;object-fit:contain;border-radius:10px;
    background:var(--bg);margin-bottom:10px}
  textarea,input[type=url],input[type=text]{width:100%;font-size:16px;padding:12px;border-radius:10px;
    border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:inherit}
  textarea{min-height:64px;resize:vertical;margin-top:10px}
  .hint{font-size:13px;color:var(--sub);line-height:1.6}
  #toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-size:15px;
    opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
  #toast.show{opacity:1}
  .hist{list-style:none;padding:0;margin:0}
  .hist li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
  .hist li:first-child{border-top:0}
  .hist .memo{color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{align-self:center;font-size:12px;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .badge.ok{color:var(--ok);border:1px solid var(--ok)}
  .badge.wait{color:var(--warn);border:1px solid var(--warn)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header>
    <h1>📸 パシャ領収書</h1>
    <button class="link" id="openSetup" hidden>設定</button>
  </header>

  <!-- 初回だけ：税理士さん（or 自分）からもらったシートのURLを登録 -->
  <section id="setup" class="card" hidden>
    <p class="step">はじめに1回だけ</p>
    <p class="hint">税理士さんからもらった「送信先URL」を貼り付けてください。<br>
      （URL付きのリンクを開いた場合は自動で入ります）</p>
    <input type="url" id="endpoint" placeholder="https://script.google.com/macros/s/…/exec" inputmode="url">
    <div style="height:10px"></div>
    <input type="text" id="who" placeholder="あなたの名前（任意）">
    <div style="height:12px"></div>
    <button class="big" id="saveSetup">保存してはじめる</button>
  </section>

  <section id="app" hidden>
    <div class="card">
      <p class="step">① 領収書を撮る</p>
      <img id="preview" alt="撮影した領収書">
      <button class="big" id="shoot">📷 撮影する</button>
      <input type="file" id="file" accept="image/*" capture="environment" hidden>
    </div>

    <div class="card">
      <p class="step">② しゃべる（例：「コンビニで文房具」）</p>
      <button class="big ghost" id="mic">🎤 タップして話す</button>
      <textarea id="memo" placeholder="ここに文字が入ります（手入力もOK）"></textarea>
    </div>

    <button class="big" id="send" disabled>✅ 送る</button>

    <div class="card" style="margin-top:12px">
      <p class="step">最近の送信</p>
      <ul class="hist" id="hist"></ul>
      <p class="hint" id="histEmpty">まだありません</p>
    </div>
  </section>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
// ---------- 保存（端末内のみ） ----------
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v);}catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};
const $ = id => document.getElementById(id);
const toast = (msg) => { const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'), 2600); };

// ---------- 画像を小さくする（送信を速く） ----------
function shrink(file, maxSide=1280, quality=0.7){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>{
      const r = Math.min(1, maxSide/Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*r); c.height = Math.round(img.height*r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

// ---------- 状態 ----------
let photo = null; // dataURL
const cfg = store.get('cfg', {endpoint:'', who:''});

// リンクで設定を受け取る： index.html?to=<送信先URL>
const qs = new URLSearchParams(location.search);
if (qs.get('to')) { cfg.endpoint = qs.get('to'); store.set('cfg', cfg); history.replaceState(null,'',location.pathname); }

function showSetup(){ $('setup').hidden=false; $('app').hidden=true; $('openSetup').hidden=true;
  $('endpoint').value=cfg.endpoint; $('who').value=cfg.who||''; }
function showApp(){ $('setup').hidden=true; $('app').hidden=false; $('openSetup').hidden=false; renderHist(); flushQueue(); }
$('openSetup').onclick = showSetup;
$('saveSetup').onclick = ()=>{
  const u = $('endpoint').value.trim();
  if (!/^https:\/\//.test(u)) { toast('https:// から始まるURLを入れてください'); return; }
  cfg.endpoint=u; cfg.who=$('who').value.trim(); store.set('cfg', cfg); showApp();
};

// ---------- ① 撮影 ----------
$('shoot').onclick = ()=> $('file').click();
$('file').onchange = async (e)=>{
  const f = e.target.files[0]; if (!f) return;
  try{
    photo = await shrink(f);
    $('preview').src = photo; $('preview').style.display='block';
    $('shoot').textContent='📷 撮り直す';
    $('shoot').classList.add('ghost');
    updateSend();
    // 撮ったらそのまま音声入力へ（対応端末のみ）
    if (recog) startRec(true); // 自動開始は失敗しても黙って無視
  }catch(err){ toast('画像を読み込めませんでした'); }
  e.target.value='';
};

// ---------- ② 音声入力 ----------
// iPhone の Chrome / Edge などは音声認識が使えないため、キーボードのマイクを案内する
const IOS_NOT_SAFARI = /iP(hone|ad|od)/.test(navigator.userAgent) && /CriOS|FxiOS|EdgiOS/.test(navigator.userAgent);
// 一度「使えない」と分かった端末は、次からキーボード入力の案内にする
const NO_SR = store.get('noSR', false);
const SR = (IOS_NOT_SAFARI || NO_SR) ? null : (window.SpeechRecognition || window.webkitSpeechRecognition);
function keyboardMode(){
  recog = null; recording = false;
  $('mic').classList.remove('rec');
  $('mic').textContent = IOS_NOT_SAFARI ? '⌨️ 下の欄→キーボードの🎤で話す（Safariならボタンで話せます）' : '⌨️ 下の欄→キーボードの🎤で話す';
  $('mic').onclick = ()=> $('memo').focus();
}
let recog = null, recording = false;
if (SR){
  recog = new SR(); recog.lang='ja-JP'; recog.interimResults=true; recog.continuous=false;
  let base='';
  recog.onstart = ()=>{ recording=true; base=$('memo').value ? $('memo').value+' ' : '';
    $('mic').classList.add('rec'); $('mic').textContent='🔴 聞いています…（タップで終了）'; };
  recog.onresult = (ev)=>{ let s=''; for (const r of ev.results) s += r[0].transcript;
    $('memo').value = base + s; };
  recog.onend = ()=>{ if (!recog) return; recording=false; $('mic').classList.remove('rec'); $('mic').textContent='🎤 タップして話す'; };
  recog.onerror = (ev)=>{
    const msg = {
      'not-allowed':'マイクがブロックされています。アドレス欄の🔒からマイクを「許可」にしてください',
      'service-not-allowed':'この端末ではボタンでの音声入力が使えません。下の欄をタップして、キーボードの🎤で話してください',
      'no-speech':'声が聞き取れませんでした。もう一度🎤を押して話してください',
      'audio-capture':'マイクが見つかりません。マイクの接続を確認してください',
      'network':'音声入力にはネット接続が必要です'
    }[ev.error];
    if (ev.error!=='aborted') toast(msg || ('音声入力エラー：'+ev.error));
    if (ev.error==='service-not-allowed'){ store.set('noSR', true); keyboardMode(); }
  };
} else {
  keyboardMode();
}
function startRec(silent){ try{ recog.start(); }catch(e){ if (!silent) toast('音声入力を開始できませんでした。もう一度🎤を押してください'); } }
if (recog) $('mic').onclick = ()=> recording ? recog.stop() : startRec(false);
function stopRec(){ if (recog && recording) recog.stop(); }

function updateSend(){ $('send').disabled = !photo; }

// ---------- ③ 送信（失敗したら端末に貯めて、次回自動で再送） ----------
async function post(item){
  const res = await fetch(cfg.endpoint, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, // プリフライト回避（GAS向け）
    body: JSON.stringify(item)
  });
  if (!res.ok) throw new Error('HTTP '+res.status);
  const j = await res.json().catch(()=>({ok:true}));
  if (j.ok===false) throw new Error(j.error||'error');
  return j;
}
// 送信待ちの列：端末に保存（容量オーバー時はメモリ上）。送信は裏で行い、画面は待たせない
let memQueue = [];
function getQueue(){ return store.get('queue', []).concat(memQueue); }
function enqueue(item){
  const q = store.get('queue', []); q.push(item);
  if (!store.set('queue', q)) memQueue.push(item);
}
function dequeue(id){
  store.set('queue', store.get('queue', []).filter(x => x.id !== id));
  memQueue = memQueue.filter(x => x.id !== id);
}
function addHist(h){ const list=store.get('hist',[]); list.unshift(h); store.set('hist', list.slice(0,20)); }
function renderHist(){
  const list=store.get('hist',[]), ul=$('hist'); ul.innerHTML='';
  const rows=[...getQueue().slice().reverse().map(x=>({at:x.at, memo:x.memo, wait:true})), ...list];
  $('histEmpty').hidden = rows.length>0;
  for (const h of rows.slice(0,20)){
    const li=document.createElement('li');
    const left=document.createElement('div'); left.style.minWidth='0';
    const d=new Date(h.at);
    const top=document.createElement('div');
    top.textContent=(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    const m=document.createElement('div'); m.className='memo'; m.textContent=h.memo||'（メモなし）';
    left.append(top, m);
    const b=document.createElement('span'); b.className='badge '+(h.wait?'wait':'ok'); b.textContent=h.wait?'送信中…':'送信済';
    li.append(left,b); ul.appendChild(li);
  }
}
let flushing=false, retryTimer=null;
async function flushQueue(){
  if (flushing) return; flushing=true;
  try{
    let item;
    while ((item = getQueue()[0])){
      try{ await post(item); }
      catch(e){ // 失敗したら30秒後にもう一度
        clearTimeout(retryTimer); retryTimer=setTimeout(flushQueue, 30000);
        break;
      }
      dequeue(item.id);
      addHist({at:item.at, memo:item.memo});
      renderHist();
    }
  } finally { flushing=false; renderHist(); }
}
window.addEventListener('online', flushQueue);
document.addEventListener('visibilitychange', ()=>{ if (!document.hidden) flushQueue(); });

$('send').onclick = ()=>{
  if (!photo) return;
  stopRec();
  const memo=$('memo').value.trim();
  const at=new Date().toISOString();
  enqueue({ id: at+'-'+Math.random().toString(36).slice(2,8), at, who:cfg.who||'', memo, image:photo });
  toast('受け付けました！（裏で送っています）');
  // すぐリセット → 次の1枚へ。送信は待たない
  photo=null; $('preview').style.display='none'; $('memo').value='';
  $('shoot').textContent='📷 撮影する'; $('shoot').classList.remove('ghost');
  updateSend(); renderHist();
  flushQueue();
};

cfg.endpoint ? showApp() : showSetup();
</script>
</body>
</html>
